# ClusterIP only: reachable inside the cluster, never through the ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-server.name" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
