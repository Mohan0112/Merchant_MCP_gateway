# Production-like VPS running k3s (docs/runbooks/vps.md; rehearsed locally with values-rehearsal.yaml).
# The CHANGE-ME values are set at deploy time: task deploy:prod passes the domain, the image tag
# (the git SHA CI built) and the Let's Encrypt email with --set.
global:
  domain: CHANGE-ME.duckdns.org
  scheme: https
  logLevel: info
  tls:
    enabled: true
    # Use letsencrypt-staging for the first install, then switch (docs/runbooks/vps.md).
    clusterIssuer: letsencrypt-prod

certManager:
  letsEncrypt:
    enabled: true
    email: CHANGE-ME@example.com

store:
  wordpress:
    image:
      repository: ghcr.io/mohan0112/merchant_mcp_gateway/wordpress
      tag: CHANGE-ME-git-sha
      pullPolicy: IfNotPresent
    environmentType: production
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1500m, memory: 768Mi }
    persistence:
      size: 5Gi
  mariadb:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    persistence:
      size: 10Gi

woo-mcp:
  image:
    repository: ghcr.io/mohan0112/merchant_mcp_gateway/woo-mcp
    tag: CHANGE-ME-git-sha

fx-mcp:
  image:
    repository: ghcr.io/mohan0112/merchant_mcp_gateway/fx-mcp
    tag: CHANGE-ME-git-sha

platform:
  gateway:
    image:
      repository: ghcr.io/mohan0112/merchant_mcp_gateway/gateway
      tag: CHANGE-ME-git-sha
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: 1000m, memory: 768Mi }
  dashboard:
    image:
      repository: ghcr.io/mohan0112/merchant_mcp_gateway/dashboard
      tag: CHANGE-ME-git-sha
  postgres:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    persistence:
      size: 5Gi
