# Safe defaults shared by every environment. Environment differences live in
# values-local.yaml and values-prod.yaml only.

global:
  # Base domain. Hosts are store.<domain> and app.<domain>.
  domain: example.com
  # Scheme of the public URLs: http locally, https behind TLS in production.
  scheme: http
  ingressClassName: traefik
  logLevel: info
  tls:
    # Production terminates TLS at Traefik with certificates from cert-manager.
    enabled: false
    clusterIssuer: ''
  # NetworkPolicies (plan §10.8): every pod in the namespace denies ingress by default, and each
  # component admits only the pods it serves. This one switch turns all of them on or off.
  # Egress stays open (Phase 2).
  networkPolicy:
    enabled: true
    # The ingress controller's pods, admitted to WordPress, the gateway and the dashboard.
    # k3s bundles Traefik in kube-system; change this for another controller.
    ingressController:
      namespace: kube-system
      podLabels:
        app.kubernetes.io/name: traefik

# cert-manager ClusterIssuers rendered by this chart (cert-manager itself, with its CRDs, is a
# prerequisite installed separately). Point global.tls.clusterIssuer at one of them.
certManager:
  # For the local production rehearsal: every certificate signs itself.
  selfSigned:
    enabled: false
    name: selfsigned
  # For a public server: renders letsencrypt-staging and letsencrypt-prod (ACME HTTP-01).
  letsEncrypt:
    enabled: false
    # Expiry notices go here. Not a secret, but personal, so set it in your own values.
    email: ''

traefik:
  # Render a k3s HelmChartConfig that raises Traefik's timeouts so long-lived SSE streams
  # (GET /mcp, /api/chat) aren't cut after the default 60 s read timeout.
  configureTimeouts: true

store:
  enabled: true

# WooCommerce MCP server. Bearer credential from Secret woo-mcp-auth; talks to WordPress over the
# internal Service with the mcp-bot REST key (ADR-0002).
woo-mcp:
  enabled: true
  image:
    repository: urumi-registry:5000/urumi-woo-mcp
    tag: dev
  env:
    WOO_BASE_URL: http://wordpress:8080
    STORE_PUBLIC_URL: '{{ .Values.global.scheme }}://store.{{ .Values.global.domain }}'
  secretEnv:
    WOO_MCP_TOKEN: { secret: woo-mcp-auth, key: token }
    WOO_CONSUMER_KEY: { secret: store-woo-api, key: consumer-key }
    WOO_CONSUMER_SECRET: { secret: store-woo-api, key: consumer-secret }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }

# Currency MCP server. Header credential (X-API-Key) from Secret fx-mcp-auth.
fx-mcp:
  enabled: true
  image:
    repository: urumi-registry:5000/urumi-fx-mcp
    tag: dev
  secretEnv:
    FX_API_KEY: { secret: fx-mcp-auth, key: api-key }
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Gateway (REST API, aggregating MCP endpoint, chat module), its PostgreSQL, and later the dashboard.
platform:
  enabled: true
  gateway:
    seedUpstreams:
      - slug: woo
        displayName: WooCommerce store
        url: http://woo-mcp:8080/mcp
        authType: bearer
        credentialSecret: { name: woo-mcp-auth, key: token }
        timeoutMs: 30000
      - slug: fx
        displayName: Currency rates
        url: http://fx-mcp:8080/mcp
        authType: header
        authHeaderName: X-API-Key
        credentialSecret: { name: fx-mcp-auth, key: api-key }
        timeoutMs: 15000
      # Third upstream, outside the cluster: GitHub's hosted MCP server (issues toolset). Seeded only
      # when Secret github-mcp has a token; otherwise skipped and retried on the next start.
      - slug: github
        displayName: GitHub issues
        url: https://api.githubcopilot.com/mcp/x/issues
        authType: bearer
        credentialSecret: { name: github-mcp, key: token }
        timeoutMs: 30000
