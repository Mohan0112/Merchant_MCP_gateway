# Local k3d cluster. *.127.0.0.1.nip.io resolves to 127.0.0.1, so no hosts-file edits are needed
# (see docs/local-domains.md). Images come from the k3d registry (push to localhost:5001).
global:
  domain: 127.0.0.1.nip.io
  scheme: http
  logLevel: debug

store:
  wordpress:
    image:
      repository: urumi-registry:5000/urumi-wordpress
      tag: dev
      pullPolicy: Always
    environmentType: local

woo-mcp:
  image:
    pullPolicy: Always

fx-mcp:
  image:
    pullPolicy: Always
