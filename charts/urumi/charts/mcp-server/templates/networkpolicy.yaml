{{- if .Values.global.networkPolicy.enabled }}
{{- if empty .Values.networkPolicy.allowFromPods }}
{{- fail "networkPolicy.allowFromPods is empty: a rule without sources would admit every pod" }}
{{- end }}
# Only the listed pods (the gateway by default) may open connections to this MCP server. With the
# namespace default deny, nothing else in the cluster can reach it, and it has no Ingress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-server.name" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromPods }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
