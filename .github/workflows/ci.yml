name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the gateway's database tests (they skip when TEST_DATABASE_URL is unset).
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  chart:
    name: helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint with local and production values
        run: |
          helm lint charts/urumi -f charts/urumi/values-local.yaml
          helm lint charts/urumi -f charts/urumi/values-prod.yaml
      - name: Render both environments (proves only values differ)
        run: |
          helm template urumi charts/urumi -n urumi -f charts/urumi/values-local.yaml > /dev/null
          helm template urumi charts/urumi -n urumi -f charts/urumi/values-prod.yaml > /dev/null

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks image scans the whole history. (gitleaks-action computes a commit range that
      # breaks on a repository's first push, because the first commit has no parent.)
      - name: Scan full git history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
