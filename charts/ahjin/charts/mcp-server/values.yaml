# One in-cluster MCP server. The umbrella chart uses this sub-chart once per server through an
# alias, and the alias becomes the resource name (woo-mcp, fx-mcp, …).
# There is deliberately no Ingress template: MCP servers are reachable only from the gateway.

image:
  repository: ''
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1
port: 8080

# Plain environment variables.
env: {}

# Environment variables read from Secrets: { ENV_NAME: { secret: name, key: key } }
secretEnv: {}

networkPolicy:
  # Pods (same namespace) allowed to call this server: only the gateway, by default. Rendered when
  # global.networkPolicy.enabled is on (the umbrella chart's single switch for every policy).
  allowFromPods:
    - app.kubernetes.io/name: gateway
  # Namespace of the gateway when the server runs in another namespace (per-store and hosted
  # servers); empty means the release's own namespace.
  gatewayNamespace: ''
  # What the server may connect to, besides DNS (when global.networkPolicy.egress.enabled):
  egress:
    # Pods in the same namespace: [{ podLabels: {...}, port: 8080 }]
    toPods: []
    # Public internet on these TCP ports (private and metadata ranges excluded). Empty: none.
    internetPorts: []

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 250m, memory: 192Mi }
