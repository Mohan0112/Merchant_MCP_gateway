server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Probes (kept out of the access log).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Vite's hashed bundles never change under the same name: cache them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths (/chat, /invite/<token>…) get index.html, never cached,
  # so a new deployment is picked up on the next page load.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
