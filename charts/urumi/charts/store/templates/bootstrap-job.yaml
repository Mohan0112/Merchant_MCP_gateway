# Idempotent store setup after every install and upgrade (urumi-bootstrap in the store image).
# Kept after success so its logs stay available for debugging; replaced at the next upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: store-bootstrap
  labels:
    {{- include "store.labels" (list . "store-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "store.labels" (list . "store-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
      containers:
        - name: bootstrap
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          command: [urumi-bootstrap]
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
            {{- include "store.bootstrapEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
