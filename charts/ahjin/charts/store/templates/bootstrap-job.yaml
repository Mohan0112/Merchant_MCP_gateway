# Idempotent store setup after every install and upgrade (ahjin-bootstrap in the store image).
# Kept after success so its logs stay available for debugging; replaced at the next upgrade.
# Like the wp-cron CronJob, it has no probes: readiness and liveness apply to long-running pods,
# while this one runs to completion and activeDeadlineSeconds bounds how long it may take.
apiVersion: batch/v1
kind: Job
metadata:
  name: store-bootstrap
  labels:
    {{- include "store.labels" (list . "store-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "store.labels" (list . "store-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
      containers:
        - name: bootstrap
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          command: [ahjin-bootstrap]
          env:
            {{- include "store.wordpressEnv" . | nindent 12 }}
            {{- include "store.bootstrapEnv" . | nindent 12 }}
          # Product photos and WooCommerce's placeholder are written here, so they must land on the
          # same volume the web pod serves. ReadWriteOnce allows it: the scheduler places this pod
          # on the volume's node, next to WordPress.
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/wp-content/uploads
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: wp-uploads
