apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "store.labels" (list . "mariadb") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "store.selectorLabels" (list . "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    {{- include "store.labels" (list . "mariadb") | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selectorLabels" (list . "mariadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" (list . "mariadb") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.db }}, key: password }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.db }}, key: root-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            {{- if .Values.backup.enabled }}
            # Read-only, and only so the backup volume binds on this node: local-path volumes bind
            # on first use, and the backup jobs then run next to the data they protect.
            - name: backups
              mountPath: /backups
              readOnly: true
            {{- end }}
          # healthcheck.sh ships with the official image and uses a healthcheck-only DB user.
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
      {{- if .Values.backup.enabled }}
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: store-backups, readOnly: true }
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "store.selectorLabels" (list . "mariadb") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.mariadb.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
