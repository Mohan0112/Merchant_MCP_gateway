{{- if .Values.global.networkPolicy.enabled }}
{{- $ic := .Values.global.networkPolicy.ingressController }}
# PostgreSQL: only the gateway pod (its migrate initContainer runs in the same pod) and the backup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" (list . "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-backup
      ports:
        - port: postgres
          protocol: TCP
{{- /*
The gateway and the dashboard: only the ingress controller. The chat agent reaches the gateway's
own /mcp on 127.0.0.1 inside the pod, which NetworkPolicies never see.
*/}}
{{- range $name := list "gateway" "dashboard" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" (list $ $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (list $ $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ic.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $ic.podLabels | nindent 14 }}
        {{- if eq $name "gateway" }}
        # Prometheus (observability sub-chart) scrapes /metrics; the store operator calls
        # /internal (stores sub-chart). The Ingress routes neither.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: store-operator
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.egress.enabled }}
---
# Gateway egress: its PostgreSQL, the MCP servers (in this namespace and in the store and hosted
# server namespaces, all labelled part-of=ahjin), and public HTTP(S) for hosted MCP servers and
# the LLM APIs. Private ranges are excluded, so an admin-entered URL can't reach the node, the
# Kubernetes API or cloud metadata even if it got past the gateway's own SSRF check.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  labels:
    {{- include "platform.labels" (list . "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (list . "gateway") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-server
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: ahjin
          podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-server
      ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.global.stores.enabled }}
    {{- include "ahjin.kubeApiEgress" . | nindent 4 }}
    {{- end }}
    {{- with .Values.gateway.networkPolicy.internetPorts }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $.Values.global.networkPolicy.egress.privateRanges | nindent 14 }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.global.networkPolicy.enabled .Values.global.networkPolicy.egress.enabled }}
---
# The backup job reaches PostgreSQL only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-backup-egress
  labels:
    {{- include "platform.labels" (list . "platform-backup") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-backup
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
