version: '3'

# Entry point for every developer workflow. Run `task --list` to see what's available.

vars:
  CLUSTER: ahjin
  CONTEXT: k3d-ahjin
  NAMESPACE: ahjin
  RELEASE: ahjin
  CHART: charts/ahjin
  REGISTRY: localhost:5001
  TAG: dev
  # Production rehearsal and VPS
  REHEARSAL_CLUSTER: ahjin-rehearsal
  REHEARSAL_CONTEXT: k3d-ahjin-rehearsal
  CERT_MANAGER_VERSION: v1.21.2
  # Images CI pushed to GHCR for this commit (override: task rehearsal:deploy IMAGE_TAG=<sha>).
  IMAGE_TAG:
    sh: git rev-parse origin/main
  IMAGE_TAG_SETS: >-
    --set store.wordpress.image.tag={{.IMAGE_TAG}}
    --set woo-mcp.image.tag={{.IMAGE_TAG}}
    --set fx-mcp.image.tag={{.IMAGE_TAG}}
    --set platform.gateway.image.tag={{.IMAGE_TAG}}
    --set platform.dashboard.image.tag={{.IMAGE_TAG}}

tasks:
  install:
    desc: Install workspace dependencies
    cmds:
      - pnpm install

  check:
    desc: Lint, typecheck and test every package
    cmds:
      - pnpm turbo run lint typecheck test

  build:
    desc: Build every package and app
    cmds:
      - pnpm turbo run build

  format:
    desc: Format the repository with Prettier
    cmds:
      - pnpm prettier --write .

  # ---------- Local cluster ----------

  cluster:up:
    desc: Create the local k3d cluster and image registry (no-op if it exists)
    status:
      - k3d cluster get {{.CLUSTER}}
    cmds:
      - k3d cluster create --config deploy/k3d/cluster.yaml
      - kubectl config use-context {{.CONTEXT}}
      - kubectl wait --for=condition=Ready nodes --all --timeout=180s

  cluster:down:
    desc: Delete the local cluster and its registry (all cluster data is lost)
    cmds:
      - k3d cluster delete {{.CLUSTER}}

  cluster:reset:
    desc: Delete and recreate the local cluster
    cmds:
      - task: cluster:down
      - task: cluster:up

  # ---------- Images ----------

  images:build:
    desc: Build all images and push them to the local k3d registry
    cmds:
      - task: image:wordpress
      - task: image:node
        vars: { APP: woo-mcp }
      - task: image:node
        vars: { APP: fx-mcp }
      - task: image:node
        vars: { APP: gateway }
      - task: image:dashboard

  image:node:
    desc: Build and push one Node service image (task image:node APP=fx-mcp)
    requires:
      vars: [APP]
    cmds:
      - docker build -f docker/node-app/Dockerfile --build-arg APP={{.APP}} -t {{.REGISTRY}}/ahjin-{{.APP}}:{{.TAG}} .
      - docker push {{.REGISTRY}}/ahjin-{{.APP}}:{{.TAG}}

  image:dashboard:
    desc: Build and push the dashboard image (static React build served by nginx)
    cmds:
      - docker build -f docker/dashboard/Dockerfile -t {{.REGISTRY}}/ahjin-dashboard:{{.TAG}} .
      - docker push {{.REGISTRY}}/ahjin-dashboard:{{.TAG}}

  image:wordpress:
    desc: Build and push the WordPress + WooCommerce store image
    cmds:
      - docker build -t {{.REGISTRY}}/ahjin-wordpress:{{.TAG}} docker/wordpress
      - docker push {{.REGISTRY}}/ahjin-wordpress:{{.TAG}}

  # ---------- Secrets ----------

  secrets:
    desc: Create or sync the Kubernetes Secrets from .env.local (never prints values)
    cmds:
      - node scripts/secrets.mjs --context={{.CONTEXT}} --namespace={{.NAMESPACE}}

  logins:
    desc: Print the generated wp-admin and dashboard logins (local use only)
    cmds:
      - cmd: >-
          echo "wp-admin   http://store.127.0.0.1.nip.io/wp-admin  user:
          $(kubectl -n {{.NAMESPACE}} get secret store-wp -o jsonpath='{.data.admin-user}' | base64 -d)
          password: $(kubectl -n {{.NAMESPACE}} get secret store-wp -o jsonpath='{.data.admin-password}' | base64 -d)"
        silent: true
      - cmd: >-
          echo "dashboard  http://app.127.0.0.1.nip.io            email:
          $(kubectl -n {{.NAMESPACE}} get secret gateway-bootstrap-admin -o jsonpath='{.data.email}' | base64 -d)
          password: $(kubectl -n {{.NAMESPACE}} get secret gateway-bootstrap-admin -o jsonpath='{.data.password}' | base64 -d)"
        silent: true
      # Demo members A and B exist once task demo:reset has run.
      - cmd: >-
          if kubectl -n {{.NAMESPACE}} get secret demo-users >/dev/null 2>&1; then
          for u in a b; do echo "demo user $u $(kubectl -n {{.NAMESPACE}} get secret demo-users -o jsonpath="{.data.user-$u-email}" | base64 -d)
          password: $(kubectl -n {{.NAMESPACE}} get secret demo-users -o jsonpath="{.data.user-$u-password}" | base64 -d)"; done; fi
        silent: true

  # ---------- Helm ----------

  chart:lint:
    desc: Lint the chart and render it with local and production values
    cmds:
      - helm lint {{.CHART}} -f {{.CHART}}/values-local.yaml
      - helm lint {{.CHART}} -f {{.CHART}}/values-prod.yaml
      - helm template {{.RELEASE}} {{.CHART}} -n {{.NAMESPACE}} -f {{.CHART}}/values-local.yaml > /dev/null
      - helm template {{.RELEASE}} {{.CHART}} -n {{.NAMESPACE}} -f {{.CHART}}/values-prod.yaml > /dev/null

  verify:k8s:
    desc: Check the rendered chart (probes, requests and limits, non-root, NetworkPolicies, no secret literals, kubeconform)
    cmds:
      - node scripts/verify-k8s.mjs {{.CLI_ARGS}}

  deploy:local:
    desc: Install or upgrade the release on the local cluster
    cmds:
      - kubectl config use-context {{.CONTEXT}}
      - >-
        helm upgrade --install {{.RELEASE}} {{.CHART}}
        --namespace {{.NAMESPACE}} --create-namespace
        -f {{.CHART}}/values-local.yaml
        --wait --timeout 10m
      # Local images are always tagged "dev", so Helm sees no change; restart Deployments so they
      # pull the freshly pushed images. (Production uses immutable git-SHA tags instead.)
      - kubectl -n {{.NAMESPACE}} rollout restart deployment
      - for d in $(kubectl -n {{.NAMESPACE}} get deployment -o name); do kubectl -n {{.NAMESPACE}} rollout status "$d" --timeout=300s; done

  store:bootstrap-logs:
    desc: Show the logs of the last store bootstrap Job
    cmds:
      - kubectl -n {{.NAMESPACE}} logs job/store-bootstrap --tail=100

  store:wipe:
    desc: Delete the store's persistent data (database and uploads). Destructive.
    prompt: This deletes the store database and all uploads. Continue?
    cmds:
      - kubectl -n {{.NAMESPACE}} delete pvc wp-uploads data-mariadb-0 --ignore-not-found

  demo:reset:
    desc: Clean demo state - no orders, sample products only, all servers on, fresh users A and B, empty audit log
    prompt: This deletes every order, every non-sample product and the audit log, and recreates users A and B. Continue?
    cmds:
      - node scripts/demo-reset.mjs --context={{.CONTEXT}} --namespace={{.NAMESPACE}} {{.CLI_ARGS}}

  dod:
    desc: Check the brief's definition of done end to end against the running cluster (CLI_ARGS e.g. -- --skip-chat)
    cmds:
      - node scripts/dod-check.mjs --context={{.CONTEXT}} --namespace={{.NAMESPACE}} {{.CLI_ARGS}}

  # ---------- Production rehearsal and VPS ----------

  cert-manager:
    desc: Install cert-manager and its CRDs into a cluster (task cert-manager KUBE_CONTEXT=<context>)
    requires:
      vars: [KUBE_CONTEXT]
    cmds:
      - >-
        helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager
        --version {{.CERT_MANAGER_VERSION}} --kube-context {{.KUBE_CONTEXT}}
        --namespace cert-manager --create-namespace --set crds.enabled=true --wait --timeout 5m

  rehearsal:up:
    desc: Stop the local cluster and create the single-node rehearsal cluster with cert-manager
    cmds:
      - k3d cluster stop {{.CLUSTER}}
      - k3d cluster create --config deploy/k3d/rehearsal.yaml
      - task: cert-manager
        vars: { KUBE_CONTEXT: '{{.REHEARSAL_CONTEXT}}' }

  rehearsal:deploy:
    desc: Install the chart on the rehearsal cluster with values-prod.yaml + values-rehearsal.yaml and CI's GHCR images
    cmds:
      - node scripts/secrets.mjs --context={{.REHEARSAL_CONTEXT}} --namespace={{.NAMESPACE}}
      - >-
        helm upgrade --install {{.RELEASE}} {{.CHART}} --kube-context {{.REHEARSAL_CONTEXT}}
        --namespace {{.NAMESPACE}} --create-namespace
        -f {{.CHART}}/values-prod.yaml -f {{.CHART}}/values-rehearsal.yaml {{.IMAGE_TAG_SETS}}
        --wait --timeout 15m --rollback-on-failure

  rehearsal:dod:
    desc: The definition-of-done check over HTTPS against the rehearsal cluster (self-signed certificates)
    cmds:
      - node scripts/dod-check.mjs --context={{.REHEARSAL_CONTEXT}} --namespace={{.NAMESPACE}} --scheme=https --insecure {{.CLI_ARGS}}

  rehearsal:down:
    desc: Delete the rehearsal cluster and start the local cluster again
    cmds:
      - k3d cluster delete {{.REHEARSAL_CLUSTER}}
      - k3d cluster start {{.CLUSTER}}

  deploy:prod:
    desc: Install or upgrade on a VPS (task deploy:prod PROD_CONTEXT=<ctx> DOMAIN=<domain> LETSENCRYPT_EMAIL=<email> [ISSUER=letsencrypt-staging])
    requires:
      vars: [PROD_CONTEXT, DOMAIN, LETSENCRYPT_EMAIL]
    vars:
      ISSUER: '{{.ISSUER | default "letsencrypt-prod"}}'
    cmds:
      - echo "Deploying images {{.IMAGE_TAG}} to {{.DOMAIN}} on context {{.PROD_CONTEXT}} (issuer {{.ISSUER}})"
      - >-
        helm upgrade --install {{.RELEASE}} {{.CHART}} --kube-context {{.PROD_CONTEXT}}
        --namespace {{.NAMESPACE}} --create-namespace -f {{.CHART}}/values-prod.yaml
        --set global.domain={{.DOMAIN}} --set global.tls.clusterIssuer={{.ISSUER}}
        --set certManager.letsEncrypt.email={{.LETSENCRYPT_EMAIL}} {{.IMAGE_TAG_SETS}}
        --wait --timeout 15m --rollback-on-failure
