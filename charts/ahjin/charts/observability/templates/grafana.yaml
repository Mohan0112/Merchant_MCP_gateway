{{- if .Values.grafana.enabled }}
# Grafana with Prometheus as its only data source and the gateway dashboard provisioned from
# files/grafana-dashboard.json. No plugins are downloaded and nothing phones home, so it runs
# with the same default-deny egress as everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    {{- include "observability.labels" (list . "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ahjin
        folder: Ahjin
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "observability.labels" (list . "grafana") | nindent 4 }}
data:
  ahjin-gateway.json: |
    {{- .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "observability.labels" (list . "grafana") | nindent 4 }}
spec:
  selector:
    {{- include "observability.selectorLabels" (list . "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "observability.labels" (list . "grafana") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (list . "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.labels" (list . "grafana") | nindent 8 }}
      annotations:
        checksum/dashboard: {{ .Files.Get "files/grafana-dashboard.json" | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.grafana.adminSecret }}, key: user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.grafana.adminSecret }}, key: password }
            - name: GF_SERVER_ROOT_URL
              value: "{{ .Values.global.scheme }}://{{ include "observability.grafanaHost" . }}"
            - name: GF_SECURITY_COOKIE_SECURE
              value: {{ eq .Values.global.scheme "https" | quote }}
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            # Offline by design: no plugin downloads, update checks, news or usage reporting.
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/ahjin-gateway.json }
            - { name: GF_PATHS_DATA, value: /var/lib/grafana }
            - { name: GF_PATHS_LOGS, value: /var/log/grafana }
            - { name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins }
            - { name: GF_LOG_MODE, value: console }
          # The first start runs Grafana's own database migrations, which takes a minute or two.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext:
            {{- include "observability.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: logs, mountPath: /var/log/grafana }
            - { name: tmp, mountPath: /tmp }
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - { name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 512Mi }
        - name: logs
          emptyDir: { sizeLimit: 64Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
{{- if .Values.grafana.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    {{- include "observability.labels" (list . "grafana") | nindent 4 }}
  {{- with .Values.global.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ . }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ include "observability.grafanaHost" . }}]
      secretName: grafana-tls
  {{- end }}
  rules:
    - host: {{ include "observability.grafanaHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: grafana, port: { name: http } }
{{- end }}
{{- end }}
