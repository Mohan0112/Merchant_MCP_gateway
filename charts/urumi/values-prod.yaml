# Production-like VPS running k3s (Task 31; rehearsed locally in Task 19).
global:
  domain: CHANGE-ME.duckdns.org
  scheme: https
  logLevel: info
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

store:
  wordpress:
    image:
      repository: ghcr.io/mohan0112/merchant_mcp_gateway/wordpress
      tag: CHANGE-ME-git-sha
      pullPolicy: IfNotPresent
    environmentType: production
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1500m, memory: 768Mi }
    persistence:
      size: 5Gi
  mariadb:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    persistence:
      size: 10Gi

woo-mcp:
  image:
    repository: ghcr.io/mohan0112/merchant_mcp_gateway/woo-mcp
    tag: CHANGE-ME-git-sha

fx-mcp:
  image:
    repository: ghcr.io/mohan0112/merchant_mcp_gateway/fx-mcp
    tag: CHANGE-ME-git-sha

platform:
  gateway:
    image:
      repository: ghcr.io/mohan0112/merchant_mcp_gateway/gateway
      tag: CHANGE-ME-git-sha
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: 1000m, memory: 768Mi }
  postgres:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    persistence:
      size: 5Gi
