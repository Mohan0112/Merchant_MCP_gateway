apiVersion: v2
name: store-instance
description: One provisioned WooCommerce store in its own namespace (WordPress, MariaDB, its woo-mcp server, quota, limits and isolation), installed by the store-operator
type: application
version: 0.1.0
appVersion: '0.5.0'
# The same sub-charts as the platform's own store, reused (DRY). The store-operator image bakes
# this chart with its dependencies (helm dependency build).
dependencies:
  - name: store
    version: 0.1.0
    repository: file://../ahjin/charts/store
  - name: mcp-server
    alias: woo-mcp
    version: 0.1.0
    repository: file://../ahjin/charts/mcp-server
