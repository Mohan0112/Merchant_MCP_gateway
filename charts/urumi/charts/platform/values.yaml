gateway:
  image:
    repository: urumi-registry:5000/urumi-gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  # MCP servers registered on first boot. Each is applied once; an admin may edit or delete it later.
  # Example: { slug, displayName, url, authType: none|bearer|header, authHeaderName,
  #            credentialSecret: { name, key }, timeoutMs }
  seedUpstreams: []
  llm:
    groqModel: openai/gpt-oss-120b
    geminiModel: gemini-2.5-flash
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 750m, memory: 512Mi }

dashboard:
  image:
    repository: urumi-registry:5000/urumi-dashboard
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image:
    repository: postgres
    tag: 17.11-alpine
  database: urumi
  user: urumi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    size: 1Gi
    storageClass: ''

# Secrets are created outside the chart by scripts/secrets.mjs (ADR-008); only names live here.
secrets:
  # keys: password
  db: platform-db
  # keys: api-key-pepper, credential-key
  crypto: gateway-crypto
  # keys: email, password
  bootstrapAdmin: gateway-bootstrap-admin
  # keys: groq-api-key, gemini-api-key
  llm: llm
