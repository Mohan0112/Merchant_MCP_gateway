gateway:
  image:
    repository: ahjin-registry:5000/ahjin-gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  # MCP servers registered on first boot. Each is applied once; an admin may edit or delete it later.
  # Example: { slug, displayName, url, authType: none|bearer|header, authHeaderName,
  #            credentialSecret: { name, key }, timeoutMs }
  seedUpstreams: []
  llm:
    groqModel: openai/gpt-oss-120b
    geminiModel: gemini-2.5-flash
  chat:
    # What the chat assistant is told about the business until an admin edits it in the dashboard
    # (Assistant page). Rendered with tpl, so it may use values such as the store's URL.
    context: ''
  networkPolicy:
    # Public ports the gateway may reach: hosted MCP servers (GitHub) and the LLM APIs. Private
    # ranges stay closed; in-cluster MCP servers are admitted by label instead.
    internetPorts: [80, 443]
  # Requests follow `kubectl top` on the local cluster (about 165Mi idle with three upstreams).
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 750m, memory: 512Mi }

dashboard:
  image:
    repository: ahjin-registry:5000/ahjin-dashboard
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image:
    repository: postgres
    tag: 17.11-alpine
  database: ahjin
  user: ahjin
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    size: 1Gi
    storageClass: ''

# Secrets are created outside the chart by scripts/secrets.mjs (ADR-008); only names live here.
secrets:
  # keys: password
  db: platform-db
  # keys: api-key-pepper, credential-key
  crypto: gateway-crypto
  # keys: email, password
  bootstrapAdmin: gateway-bootstrap-admin
  # keys: groq-api-key, gemini-api-key
  llm: llm

# Backups (Task 28): nightly and before every helm upgrade, into a volume Helm never deletes.
backup:
  enabled: true
  schedule: '30 2 * * *'
  timeZone: Asia/Kolkata
  keep: 7
  beforeUpgrade: true
  persistence:
    size: 1Gi
    storageClass: ''
